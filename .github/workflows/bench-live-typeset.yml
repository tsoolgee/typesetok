name: Bench Live Typeset

on:
  push:
    branches: [perf/measure-036]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare three versions
        shell: pwsh
        run: |
          foreach ($t in 'v0.35.2', 'v0.36.1') {
            git fetch --no-tags https://github.com/TypesetOK/typesetok.git "refs/tags/${t}:refs/tags/${t}"
            git worktree add "..\$t" $t
          }
          npm install --ignore-scripts
          cargo build --release -p tok-cli
          Copy-Item target\release\tok-cli.exe ..\tok-cli-fix.exe
          foreach ($t in 'v0.35.2', 'v0.36.1') {
            Push-Location "..\$t"
            cargo build --release -p tok-cli
            Copy-Item target\release\tok-cli.exe "..\tok-cli-$t.exe"
            Pop-Location
          }

      - name: Bench
        shell: pwsh
        run: |
          $b = "scripts/bench-live-typeset.mjs"
          $out = @()
          foreach ($n in 150, 600, 1500) {
            $out += node $b ..\v0.35.2 ..\tok-cli-v0.35.2.exe "0.35.2" $n
            $out += node $b ..\v0.36.1 ..\tok-cli-v0.36.1.exe "0.36.1" $n --with-preflight --assets-from '@PKG'
            $out += node $b . ..\tok-cli-fix.exe "fix: rust only" $n --with-preflight --assets-from '@PKG'
            $out += node $b . ..\tok-cli-fix.exe "fix: rust + string ipc" $n --with-preflight --assets-from '@PKG' --ipc=string
            $out += node $b . ..\tok-cli-fix.exe "fix, no preflight (cost of it)" $n --assets-from '@PKG' --ipc=string
            $out += ""
          }
          $out | ForEach-Object { Write-Host $_ }
          New-Item -ItemType Directory -Force bench-out | Out-Null
          $out | Out-File bench-out\report.txt -Encoding utf8
          "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-live-typeset
          path: bench-out/

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build tok-cli
        run: cargo build --release -p tok-cli
      - name: Frontend build and tests
        shell: pwsh
        env:
          TOK_CLI_PATH: target/release/tok-cli.exe
        run: |
          npm install
          npm run build
          npm test
