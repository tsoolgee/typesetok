name: Desktop App Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_TARGET_DIR: target

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build tok-cli release binary
        run: cargo build --release -p tok-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build TypeScript & bundle UI
        run: npm run build

      - name: Run frontend tests
        run: npm test
        env:
          # Integration tests spawn the engine; use the release binary built above.
          TOK_CLI_PATH: target/release/tok-cli.exe

      - name: Upload Desktop bundle artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: typesetok-desktop-windows-x64
          path: |
            packages/tok-ui/dist
            packages/tok-electron/dist
            assets/fonts
            target/release/tok-cli.exe
